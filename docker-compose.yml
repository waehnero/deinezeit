services:
  db:
    image: postgres:16-alpine
    container_name: deinezeit_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: deinezeit_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal

  backend:
    build: ./backend
    container_name: deinezeit_backend
    restart: always
    depends_on:
      - db
      - minio
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: deinezeit-files
      MINIO_PUBLIC_URL: ${FRONTEND_URL}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME}
      INSTALL_DIR: /opt/deinezeit
      APP_VERSION: ${APP_VERSION:-1.12.80}
      # Ortszeit für Kalenderdaten, Berichte und Worker-Zeiten (Audit BUG-002)
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/deinezeit:/opt/deinezeit
      # Nur-Lese-Zugriff auf die Let's-Encrypt-Zertifikate. Damit kann das
      # Backend die Restlaufzeit auslesen und rechtzeitig warnen, BEVOR das
      # Zertifikat abläuft (Einstellungen → System, plus E-Mail an die
      # Administratoren). Schreiben darf es nichts — das bleibt bei certbot.
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Cache-Buster: wird vom Deploy mit dem aktuellen Git-SHA gesetzt, damit
        # der Frontend-Build den neuen Quellcode garantiert neu kompiliert.
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: deinezeit_frontend
    restart: always
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: deinezeit_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - internal
      - external
    # ── Zertifikat neu einlesen ───────────────────────────────────────────────
    # nginx hält das SSL-Zertifikat im Arbeitsspeicher. Erneuert certbot die
    # Datei auf der Platte, merkt nginx davon von sich aus NICHTS und liefert
    # weiter das alte Zertifikat aus — bis es abläuft. Deshalb lädt nginx sich
    # hier alle 6 Stunden selbst neu (`nginx -s reload`, unterbrechungsfrei:
    # laufende Anfragen werden zu Ende bedient).
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    container_name: deinezeit_certbot
    # Ohne restart-Policy kommt dieser Container nach einem Server-Neustart
    # nicht wieder — die Erneuerungsschleife wäre dann still tot.
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # ── entrypoint NICHT entfernen ────────────────────────────────────────────
    # Das Image certbot/certbot hat ENTRYPOINT ["certbot"]. Ohne die folgende
    # Zeile wird `command` NICHT als Shell-Befehl ausgeführt, sondern als
    # Argumentliste an certbot durchgereicht — der Container startete dann als
    #     certbot /bin/sh -c 'while :; do …'
    # und beendete sich binnen Sekunden mit Exit-Code 2. Genau daran ist die
    # Erneuerung gescheitert: die Schleife lief kein einziges Mal, und weil
    # niemand nach dem Container sah, fiel es erst auf, als das Zertifikat am
    # 27.08.2026 abgelaufen war. Prüfen lässt sich das jederzeit mit
    #     docker compose ps certbot     → COMMAND muss mit "/bin/sh" beginnen
    entrypoint: /bin/sh
    # Alle 12 Stunden prüfen. Let's Encrypt erneuert ab 30 Tagen Restlaufzeit —
    # es bleiben also rund 60 Versuche, bevor es eng wird. Der Zeitstempel im
    # Log zeigt in `docker compose logs certbot` sofort, ob die Schleife lebt.
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          echo "[certbot] $$(date '+%Y-%m-%d %H:%M:%S') Erneuerung wird geprueft"
          certbot renew --webroot --webroot-path /var/www/certbot
          sleep 12h & wait $${!}
        done


volumes:
  postgres_data:
  minio_data:
  certbot_www:
  certbot_conf:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
