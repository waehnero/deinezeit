# Lasttest-Werkzeug (Locust) — STILLGELEGT (29.08.2026)
# =====================================================
#
# Der Lasttest ist auf Olivers Wunsch vorerst außer Betrieb. Die erste
# Erprobung überzeugte nicht: Der Prüfdaten-Generator scheiterte an der
# Passwortregel und an fest verdrahteten Stammdatenfeldern, und die Läufe
# hinterließen Prüfdaten in der Produktivinstallation. Das Thema wird zu einem
# späteren Zeitpunkt neu aufgesetzt.
#
# Der Dienst hängt deshalb an einem Profil, das niemand aktiviert. Ein
#     docker compose -f docker-compose.lasttest.yml up
# startet dadurch NICHTS mehr ("no service selected") — auch nicht aus
# Versehen, und auch nicht am Server.
#
# WIEDER IN BETRIEB NEHMEN: die Zeile `profiles:` samt Wert entfernen. Dann
# aber bitte auch die Riegel in lasttest/pruefdaten.py und
# lasttest/locustfile.py lösen und den Reiter in der Oberfläche wieder
# freischalten (frontend/src/pages/SettingsPage.jsx).
services:
  locust:
    profiles: ["stillgelegt"]
    image: locustio/locust:2.31.5
    container_name: deinezeit-locust
    ports:
      - "8089:8089"
    volumes:
      - ./lasttest:/mnt/locust:ro
    # host.docker.internal zeigt aus dem Container auf den Mac — also auf
    # nginx unter http://localhost. Der Weg über nginx ist Absicht: gemessen
    # wird die Kette, die auch der Benutzer durchläuft.
    command: >
      -f /mnt/locust/locustfile.py
      --host http://host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LASTTEST_PASSWORT: ${LASTTEST_PASSWORT:-Zimt-Regenschirm-7719}
      LASTTEST_BENUTZER: ${LASTTEST_BENUTZER:-100}
