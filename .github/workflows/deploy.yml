# ============================================================
# DeineZeit – Automatisches Deployment (CD)
# Läuft nach jeder erfolgreichen CI auf dem main-Branch (oder von Hand)
#
# Voraussetzungen (einmalig in GitHub einstellen):
#   Settings → Secrets and variables → Actions → New repository secret
#
#   SSH_HOST          IP oder Domain deines Servers
#   SSH_USER          Linux-Benutzer (z.B. root oder deinezeit)
#   SSH_PRIVATE_KEY   Privater SSH-Schlüssel (Inhalt von ~/.ssh/id_rsa)
#   DEPLOY_PATH       Pfad auf dem Server, z.B. /opt/deinezeit
# ============================================================

name: Deploy → Produktion

# Läuft erst, wenn die CI („CI – Qualitätsprüfung") für main durch ist —
# und nur bei Erfolg. Bis 03.09.2026 startete der Deploy parallel zur CI beim
# Push auf main: main war zwar über den Branch-Schutz abgesichert, aber nach
# dem Merge zweier PRs konnte main rot sein und wurde trotzdem ausgerollt
# (Audit OPS-001).
on:
  workflow_run:
    workflows: ["CI – Qualitätsprüfung"]
    types: [completed]
    branches: [main]
  # Von Hand auslösbar (Actions → Deploy → Produktion → Run workflow).
  #
  # Nötig, weil der Deploy sonst ausschließlich am Push auf main hängt: Legt
  # GitHub bei einer Störung gar keinen Lauf an, gibt es auch nichts zum
  # Wiederholen — und main ist geschützt, ein Nachschieben per Push also
  # ausgeschlossen. Genau dieser Fall trat am 06.08.2026 während der
  # Actions-Großstörung ein.
  workflow_dispatch:

# Deploys stellen sich in eine Reihe, statt sich zu überholen. Ein laufender
# Deploy wird NICHT abgebrochen (anders als in der CI): mittendrin abgewürgt
# hinterlässt er halb ersetzte Container und eine tote Seite.
concurrency:
  group: deploy-produktion
  cancel-in-progress: false

jobs:
  deploy:
    name: "Auf Server deployen"
    runs-on: ubuntu-latest

    # Nur bei grüner CI — oder von Hand (workflow_dispatch), z. B. nach einer
    # Actions-Störung. Der Sicherheits-Job der CI ist nicht blockierend
    # (continue-on-error) und hält den Deploy daher nicht auf.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: https://${{ vars.DOMAIN || 'deine-domain.at' }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          # Bei workflow_run genau den Stand nehmen, den die CI geprüft hat
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: "SSH-Schlüssel einrichten"
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: "Bekannten Host eintragen (Fingerprint)"
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: "Code auf Server übertragen"
        # `--delete` entfernt am Server alles, was es im Runner-Checkout nicht
        # gibt. Deshalb muss hier JEDER Pfad stehen, der nur am Server entsteht
        # — sonst ist er nach dem nächsten Deploy weg. Ausgeschlossene Pfade
        # werden von rsync weder überschrieben noch gelöscht.
        #
        #   backups/     Vor-Update-Sicherungen (scripts/deploy.sh, install.sh)
        #   logs/        update.log des In-App-Updates (update.sh)
        #   backup.cfg   wird vom Backend am Server beschrieben (Einstellungen)
        #   mockups/, design-vorschlaege/, lasttest/
        #                Entwurfs- und Messdateien, gehören nicht auf den Server
        #
        # Bis 02.09.2026 fehlten backups/ und logs/ in dieser Liste: jeder
        # Merge auf main hat die Sicherungen am Server gelöscht (Audit DATA-001).
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='backend/static' \
            --exclude='postgres_data' \
            --exclude='backups/' \
            --exclude='logs/' \
            --exclude='backup.cfg' \
            --exclude='mockups/' \
            --exclude='design-vorschlaege/' \
            --exclude='lasttest/' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: "Docker-Images bauen & Dienste neu starten"
        # Ruft das versionierte scripts/deploy.sh per SSH auf (CI-Modus via
        # GIT_SHA). Das Skript liegt als DATEI am Server (von rsync übertragen),
        # daher kommt sein Exit-Code zuverlässig zurück: schlägt der Deploy fehl,
        # wird dieser Step ROT (vorher verschluckte das Inline-Heredoc den Fehler).
        shell: bash
        run: |
          set -eo pipefail
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "GIT_SHA='${{ github.event.workflow_run.head_sha || github.sha }}' DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' DOMAIN='${{ vars.DOMAIN }}' bash '${{ secrets.DEPLOY_PATH }}/scripts/deploy.sh'"

      - name: "Healthcheck"
        # Schlägt jetzt FEHL, wenn die Seite nach dem Deploy nicht antwortet —
        # bis 03.09.2026 war das nur eine Warnung, und der Lauf blieb grün,
        # während die Seite unerreichbar war (Audit OPS-001). Zwölf Versuche im
        # Abstand von zehn Sekunden decken den Container-Neustart ab.
        run: |
          ZIEL="https://${{ vars.DOMAIN || secrets.SSH_HOST }}/api/health"
          for versuch in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$ZIEL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ App läuft (HTTP $STATUS, Versuch $versuch)"
              exit 0
            fi
            echo "  Versuch $versuch/12: HTTP $STATUS – warte 10 s"
            sleep 10
          done
          echo "✗ Healthcheck fehlgeschlagen: $ZIEL antwortet nicht mit 200."
          echo "  ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          echo "  cd ${{ secrets.DEPLOY_PATH }} && docker compose logs --tail=50"
          exit 1

      - name: "Deployment-Zusammenfassung"
        if: always()
        run: |
          echo "## Deployment-Ergebnis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Auslöser:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Zeitpunkt:** $(date '+%d.%m.%Y %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- **Gestartet von:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
