[pytest]
# Testverzeichnis und Namensmuster
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Übersichtliche Ausgabe.
#
# --durations=15 listet am Ende die fünfzehn langsamsten Tests mit ihrer
# Laufzeit auf. Damit muss man beim nächsten Mal nicht raten, wo die Minuten
# hingehen — die Antwort steht dann unter dem Testergebnis.
addopts = -v --tb=short --durations=15
