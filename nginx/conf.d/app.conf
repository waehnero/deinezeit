# HTTP → HTTPS Weiterleitung
server {
    listen 80;
    server_name deine-domain.at;

    # Let's Encrypt Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Alles andere auf HTTPS umleiten
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name deine-domain.at;

    # SSL-Zertifikate (von Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/deine-domain.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deine-domain.at/privkey.pem;

    # Moderne SSL-Einstellungen
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # ── Security-Header ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "DENY"                               always;
    add_header X-Content-Type-Options     "nosniff"                            always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # ── Content-Security-Policy (Audit SEC-009) ───────────────────────────────
    # Zunächst NUR MELDEN (Report-Only): Der Browser protokolliert Verstöße in
    # der Konsole, blockiert aber nichts. Nach einem Rundgang durch alle Seiten
    # ohne Meldungen wird die Zeile auf "Content-Security-Policy" umgestellt
    # (K-16, zweiter Schritt). Erlaubt: eigene Skripte; Inline-Styles (React
    # setzt style-Attribute, Tailwind nicht); Bilder/Vorschauen/PDF aus blob:-
    # und data:-URLs; keine Plugins; keine Einbettung in fremde Seiten.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Upload-Größe begrenzen (Logo, Favicon, Datacenter, Postecke-Fotos/-Videos).
    # iPhone-Fotos haben 3-8 MB (einzeln hochgeladen, Backend-Limit 25 MB je Foto);
    # Postecke-Videos bis 200 MB (Backend-Limit MAX_VIDEO_BYTES) — 200m deckt das ab.
    client_max_body_size 200m;

    # Wartungsseite bei Backend/Frontend-Ausfall (z.B. während eines Updates)
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Docker-interner DNS-Resolver: löst Container-IPs dynamisch auf
    # (verhindert "Connection refused" nach Container-Neustart)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend (React App)
    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-Unterstützung (für spätere Echtzeit-Features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # KI-Aufrufe (Postecke, Mail-Import) können länger dauern als die
        # nginx-Standard-60s — sonst bricht der Proxy die Antwort ab.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
