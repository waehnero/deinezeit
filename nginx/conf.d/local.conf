# Lokale Test-Konfiguration (kein HTTPS, kein SSL)
# Nur für Entwicklung/Test auf dem eigenen Computer

server {
    listen 80;
    server_name localhost;

    # Frontend (React App)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Gleichlauf mit der Produktionskonfiguration (conf.d/app.conf). Fehlte
        # hier, wodurch der Anmelde-Prüfpfad lokal bei jedem Zugriff die
        # Container-Adresse festhielt statt der echten. Solche Unterschiede
        # zwischen lokal und live sind genau die, die man erst auf dem Server
        # bemerkt.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        # WebSocket-Unterstützung
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
