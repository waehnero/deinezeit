events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 200M;   # Postecke-Video-Upload (bis 200 MB)

    # Zugriffslog mit Anfragekennung ($request_id, 32 Hex-Zeichen). Dieselbe
    # Kennung geht als X-Request-ID ans Backend und steht dort in jeder
    # Logzeile in eckigen Klammern — so lassen sich nginx- und Backend-Zeilen
    # einer Anfrage zusammensuchen (Audit OPS-006).
    log_format mit_kennung '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rid=$request_id rt=$request_time';
    access_log /var/log/nginx/access.log mit_kennung;

    # Sicherheits-Header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Kompression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
